<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você, Meu Amor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .playing {
            transform: scale(1.05);
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.5);
        }
        button {
            transition: all 0.3s ease;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-100 via-purple-50 to-red-100 p-4 pb-8">
    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="text-center py-8 mb-6">
            <div class="flex justify-center mb-4">
                <svg class="w-16 h-16 text-red-500 fill-red-500 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                Para Você, Meu Amor
            </h1>
            <p class="text-gray-600">
                Toque nas bandeiras para ouvir ❤️
            </p>
        </div>

        <!-- Languages Grid -->
        <div class="grid grid-cols-2 gap-4" id="languagesGrid"></div>

        <!-- Footer -->
        <div class="text-center mt-8 p-6 bg-white/50 rounded-2xl backdrop-blur-sm">
            <p class="text-gray-700 italic">
                "Em qualquer idioma, meu amor por você é o mesmo"
            </p>
            <div class="flex justify-center gap-2 mt-3">
                <svg class="w-4 h-4 text-red-500 fill-red-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                <svg class="w-4 h-4 text-red-500 fill-red-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                <svg class="w-4 h-4 text-red-500 fill-red-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const languages = [
            { id: 1, country: 'Brasil', flag: '🇧🇷', text: 'Eu te amo', lang: 'pt-BR', colors: 'from-green-500 to-yellow-400', audio: 'Audios/Brasil.m4a' },
            { id: 2, country: 'Estados Unidos', flag: '🇺🇸', text: 'I love you', lang: 'en-US', colors: 'from-blue-600 to-red-600', audio: 'Audios/Estados Unidos.m4a' },
            { id: 3, country: 'Espanha', flag: '🇪🇸', text: 'Te amo', lang: 'es-ES', colors: 'from-red-600 to-yellow-400', audio: 'Audios/Espanha.m4a' },
            { id: 4, country: 'França', flag: '🇫🇷', text: 'Je t\'aime', lang: 'fr-FR', colors: 'from-blue-600 to-red-600', audio: 'Audios/Franca.m4a' },
            { id: 5, country: 'Itália', flag: '🇮🇹', text: 'Ti amo', lang: 'it-IT', colors: 'from-green-500 to-red-600', audio: 'Audios/Italia.m4a' },
            { id: 6, country: 'Alemanha', flag: '🇩🇪', text: 'Ich liebe dich', lang: 'de-DE', colors: 'from-yellow-400 to-red-600', audio: 'Audios/Alemanha.m4a' },
            { id: 7, country: 'Japão', flag: '🇯🇵', text: '愛してる', lang: 'ja-JP', colors: 'from-red-500 to-white', audio: 'Audios/Japao.m4a' },
            { id: 8, country: 'Coreia', flag: '🇰🇷', text: '사랑해', lang: 'ko-KR', colors: 'from-blue-500 to-red-500', audio: 'Audios/Coreia.m4a' },
            { id: 9, country: 'China', flag: '🇨🇳', text: '我爱你', lang: 'zh-CN', colors: 'from-red-600 to-yellow-400', audio: 'Audios/China.m4a' },
            { id: 10, country: 'Rússia', flag: '🇷🇺', text: 'Я люблю тебя', lang: 'ru-RU', colors: 'from-blue-600 to-red-600', audio: 'Audios/Russia.m4a' },
            { id: 11, country: 'Grécia', flag: '🇬🇷', text: 'Σ\'αγαπώ', lang: 'el-GR', colors: 'from-blue-500 to-white', audio: 'Audios/Grecia.m4a' },
            { id: 12, country: 'Índia', flag: '🇮🇳', text: 'मैं तुमसे प्यार करता हूँ', lang: 'hi-IN', colors: 'from-orange-500 to-green-600', audio: 'Audios/India.m4a' },
            { id: 13, country: 'Portugal', flag: '🇵🇹', text: 'Amo-te', lang: 'pt-PT', colors: 'from-green-600 to-red-600', audio: 'Audios/Portugal.m4a' },
            { id: 14, country: 'Holanda', flag: '🇳🇱', text: 'Ik hou van je', lang: 'nl-NL', colors: 'from-red-600 to-blue-600', audio: 'Audios/Holanda.m4a' },
            { id: 15, country: 'Suécia', flag: '🇸🇪', text: 'Jag älskar dig', lang: 'sv-SE', colors: 'from-blue-500 to-yellow-400', audio: 'Audios/Suecia.m4a' },
            { id: 17, country: 'Polônia', flag: '🇵🇱', text: 'Kocham cię', lang: 'pl-PL', colors: 'from-white to-red-600', audio: 'Audios/Polonia.m4a' },
            { id: 18, country: 'Turquia', flag: '🇹🇷', text: 'Seni seviyorum', lang: 'tr-TR', colors: 'from-red-600 to-white', audio: 'Audios/Turquia.m4a' },
            { id: 19, country: 'Tailândia', flag: '🇹🇭', text: 'ฉันรักคุณ', lang: 'th-TH', colors: 'from-red-600 to-blue-600', audio: 'Audios/Tailandia.m4a' },
            { id: 20, country: 'Vietnã', flag: '🇻🇳', text: 'Anh yêu em', lang: 'vi-VN', colors: 'from-red-600 to-yellow-400', audio: 'Audios/Vietna.m4a' },
            { id: 21, country: 'Indonésia', flag: '🇮🇩', text: 'Aku cinta kamu', lang: 'id-ID', colors: 'from-red-600 to-white', audio: 'Audios/Indonesia.m4a' },
            { id: 22, country: 'Filipinas', flag: '🇵🇭', text: 'Mahal kita', lang: 'fil-PH', colors: 'from-blue-500 to-red-600', audio: 'Audios/Filipinas.m4a' },
            { id: 23, country: 'Argentina', flag: '🇦🇷', text: 'Te amo', lang: 'es-AR', colors: 'from-blue-400 to-yellow-300', audio: 'Audios/Argentina.m4a' },
            { id: 24, country: 'México', flag: '🇲🇽', text: 'Te amo', lang: 'es-MX', colors: 'from-green-600 to-red-600', audio: 'Audios/Mexico.m4a' },
        ];

        let currentPlayingId = null;

        function speak(text, lang, id, audioUrl) {
            // Remove classe de playing anterior
            if (currentPlayingId) {
                const prevButton = document.querySelector(`[data-id="${currentPlayingId}"]`);
                if (prevButton) {
                    prevButton.classList.remove('playing');
                    const prevIcon = prevButton.querySelector('.volume-icon');
                    if (prevIcon) prevIcon.style.display = 'none';
                }
            }

            const button = document.querySelector(`[data-id="${id}"]`);
            const volumeIcon = button.querySelector('.volume-icon');

            // Se tiver áudio personalizado, toca ele
            if (audioUrl) {
                const audio = new Audio(audioUrl);
                currentPlayingId = id;
                button.classList.add('playing');
                volumeIcon.style.display = 'block';
                
                audio.play();
                audio.onended = () => {
                    currentPlayingId = null;
                    button.classList.remove('playing');
                    volumeIcon.style.display = 'none';
                };
                return;
            }

            // Senão, usa o sintetizador de voz
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                utterance.pitch = 1;
                
                currentPlayingId = id;
                button.classList.add('playing');
                volumeIcon.style.display = 'block';
                
                utterance.onend = () => {
                    currentPlayingId = null;
                    button.classList.remove('playing');
                    volumeIcon.style.display = 'none';
                };
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Gera os cards
        const grid = document.getElementById('languagesGrid');
        languages.forEach(item => {
            const button = document.createElement('button');
            button.setAttribute('data-id', item.id);
            button.className = 'relative overflow-hidden rounded-2xl p-6 shadow-lg';
            button.onclick = () => speak(item.text, item.lang, item.id, item.audio);
            
            button.innerHTML = `
                <div class="absolute inset-0 bg-gradient-to-br ${item.colors} opacity-20"></div>
                <div class="relative">
                    <div class="text-6xl mb-3">${item.flag}</div>
                    <div class="text-sm font-semibold text-gray-800 mb-1">${item.country}</div>
                    <div class="text-xs text-gray-600 mb-2">${item.text}</div>
                    <svg class="volume-icon w-4 h-4 text-red-500 mx-auto animate-pulse" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </div>
            `;
            
            grid.appendChild(button);
        });
    </script>
</body>
</html>
